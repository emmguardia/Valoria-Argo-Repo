apiVersion: v1
kind: ConfigMap
metadata:
  name: valoria-front-nginx
  namespace: {{ include "valoria.namespace" . }}
  labels:
    {{- include "valoria.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json image/svg+xml;

        client_max_body_size 50M;

        # CSP : seule protection du jeton de session (gardé dans le navigateur) contre un script injecté. Les autres
        # en-têtes de sécurité viennent du middleware Traefik « security-headers ». Hérité par « location / »
        # (les blocs qui posent leurs propres add_header, comme les fichiers versionnés, ne l'ont pas : ce ne sont pas des pages).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

        {{- if .Values.nginx.apiProxy.enabled }}
        location /api/ {
            proxy_pass {{ .Values.nginx.apiProxy.upstream }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
        {{- end }}

        # Fichiers versionnés (empreinte dans le nom) : gardés un an ; un fichier absent (ancienne version) est une
        # vraie 404, pas la page HTML que le navigateur prendrait pour du JS (écran vide après un déploiement)
        location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|avif|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
            error_page 404 /__absent;
        }

        location = /__absent {
            internal;
            return 404;
        }

        # La page elle-même est toujours revalidée : après un déploiement, le navigateur charge les nouveaux fichiers
        location / {
            expires epoch;
            try_files $uri $uri/ /index.html;
        }

        error_page 404 /index.html;
        error_page 405 =200 /index.html;
    }
