apiVersion: apps/v1
kind: Deployment
metadata:
  name: valoria-backend
  namespace: {{ include "valoria.namespace" . }}
  labels:
    {{- include "valoria.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: valoria-backend
  template:
    metadata:
      labels:
        app: valoria-backend
    spec:
      # Réplicas toujours sur des nœuds différents (un nœud k3s par hôte Proxmox) : la perte d'un hôte ne coupe pas l'API.
      # Aucun traitement en tâche de fond ne doit tourner en double : la file de commandes du serveur Minecraft
      # est réservée ligne par ligne en base (voir services/serverQueueService.ts).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: valoria-backend
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: backend
        image: {{ .Values.backend.image }}
        imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: {{ .Values.backend.port }}
        env:
        - name: PORT
          value: {{ .Values.backend.port | quote }}
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: db-host
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: db-port
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: db-password
        - name: JWT_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: jwt-private-key
        - name: JWT_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: jwt-public-key
        - name: STRIPE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: stripe-secret-key
              optional: true
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: stripe-publishable-key
              optional: true
        # Secret de signature du webhook Stripe (whsec_…) : sans lui, les avis de paiement de Stripe sont ignorés et
        # les Écus ne sont crédités que si l'acheteur revient sur /ecus après le paiement
        - name: STRIPE_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: stripe-webhook-secret
              optional: true
        # Jeton partagé avec le plugin du serveur Minecraft (API /api/server) ; optionnel tant qu'il n'est pas scellé
        - name: VALORIA_SERVER_TOKEN
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: server-token
              optional: true
        - name: RCON_HOST
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: rcon-host
              optional: true
        - name: RCON_PORT
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: rcon-port
              optional: true
        - name: RCON_PASSWORD
          valueFrom:
            secretKeyRef:
              name: valoria-secrets
              key: rcon-password
              optional: true
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 8
          periodSeconds: 8
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.backend.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
